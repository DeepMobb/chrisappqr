<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR List Scanner</title>
  <style>
    :root{
      --bg: #F5F5F5; /* light grey */
      --accent: #C82333; /* red */
      --dark: #111; /* black-ish */
      --white: #fff;
      --muted: #777;
      --card: #fff;
      --glass: rgba(255,255,255,0.6);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background: linear-gradient(180deg, var(--bg), #eee);
      color:var(--dark);
      -webkit-font-smoothing:antialiased;
    }

    .app {
      max-width:900px;
      margin:28px auto;
      background:transparent;
      padding:18px;
    }

    header {
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }

    .logo {
      width:56px;
      height:56px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),#9b1d2a);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--white);
      font-weight:700;
      font-size:20px;
      box-shadow:0 6px 18px rgba(0,0,0,0.12);
    }

    h1 { margin:0; font-size:18px; }
    p.lead { margin:0; color:var(--muted); font-size:13px; }

    /* screens */
    .screen {
      background: transparent;
      border-radius:12px;
      padding:16px;
      min-height:320px;
    }

    /* main screen card */
    .card {
      background:var(--card);
      border-radius:12px;
      padding:18px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
    }

    .center {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
    }

    button.primary {
      background:var(--accent);
      color:var(--white);
      border:0;
      padding:12px 18px;
      border-radius:10px;
      font-weight:600;
      box-shadow:0 6px 14px rgba(200,30,45,0.18);
      cursor:pointer;
      transition:transform .08s ease, box-shadow .12s ease;
    }
    button.primary:active { transform:translateY(1px) scale(.997); }

    /* list of reports on main */
    .reports {
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .report-item {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      padding:10px 12px;
      border-radius:10px;
      background:linear-gradient(180deg,var(--white),#fafafa);
      border:1px solid rgba(0,0,0,0.04);
    }
    .report-item small { color:var(--muted); }

    /* initiate view */
    .init-top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
    }
    .items {
      min-height:220px;
      border-radius:10px;
      padding:12px;
      background:linear-gradient(180deg,#fff,#fbfbfb);
      border:1px dashed rgba(0,0,0,0.06);
      overflow:auto;
    }
    .item {
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:8px;
      border-radius:8px;
      border-bottom:1px dashed rgba(0,0,0,0.03);
    }
    .item:last-child { border-bottom:0; }
    .item .txt {
      font-size:14px;
      color:var(--dark);
    }
    .item .meta { font-size:12px; color:var(--muted); }

    /* bottom toolbar */
    .toolbar {
      display:flex;
      gap:12px;
      margin-top:12px;
      justify-content:space-between;
      align-items:center;
    }
    .fab {
      width:56px;
      height:56px;
      border-radius:14px;
      background:var(--dark);
      color:var(--white);
      display:flex;
      align-items:center;
      justify-content:center;
      border:0;
      box-shadow:0 8px 22px rgba(0,0,0,0.18);
      cursor:pointer;
    }

    .save-btn {
      flex:1;
      margin-left:12px;
      border-radius:12px;
      padding:12px 18px;
      background:linear-gradient(90deg,var(--accent),#b71f2a);
      color:var(--white);
      border:0;
      font-weight:600;
      cursor:pointer;
    }

    /* scanner modal */
    .modal {
      position:fixed;
      left:0; top:0; right:0; bottom:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:40;
      background:rgba(0,0,0,0.45);
      padding:18px;
      animation:fade .15s;
    }
    .scanner {
      width:100%;
      max-width:720px;
      background:var(--card);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,0.38);
      display:flex;
      flex-direction:column;
    }
    .scanner .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 12px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      background:linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
    }
    .video-wrap {
      position:relative;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:300px;
    }
    video {
      width:100%;
      height:auto;
      max-height:60vh;
      object-fit:cover;
    }
    .scan-box {
      position:absolute;
      width:60%;
      max-width:420px;
      height:40%;
      max-height:260px;
      border-radius:10px;
      border:3px dashed rgba(255,255,255,0.6);
      box-shadow:0 0 0 9999px rgba(0,0,0,0.18) inset;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--white);
      font-weight:600;
      text-shadow:0 1px 6px rgba(0,0,0,0.8);
    }
    .found-popup {
      padding:12px;
      background:linear-gradient(180deg,#fff,#f8f8f8);
      border-radius:12px;
      margin:12px;
      box-shadow:0 12px 26px rgba(0,0,0,0.12);
    }
    .controls {
      display:flex;
      gap:8px;
      padding:10px;
      align-items:center;
      justify-content:flex-end;
      border-top:1px solid rgba(0,0,0,0.04);
    }

    .muted-note { color:var(--muted); font-size:13px; }

    /* small buttons */
    button.ghost {
      background:transparent;
      border:1px solid rgba(0,0,0,0.06);
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
    }
    button.danger {
      background:#fff; color:var(--accent);
      border:1px solid rgba(200,30,45,0.08);
    }

    @keyframes fade { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }

    /* responsiveness */
    @media (max-width:560px){
      .scan-box { width:80%; height:36%; }
      .fab { width:48px; height:48px; border-radius:12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">QR</div>
      <div>
        <h1>QR List Scanner</h1>
        <p class="lead">Simple scanner to build lists of QR data</p>
      </div>
    </header>

    <!-- MAIN SCREEN -->
    <section id="mainScreen" class="screen card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h2 style="margin:0 0 6px 0;">Velkommen, Hans</h2>
          <div class="muted-note">Tryk "Ny liste" for at starte en ny rapport</div>
        </div>
        <div>
          <button id="newListBtn" class="primary">Ny liste</button>
        </div>
      </div>

      <div class="reports" id="reportsList" aria-live="polite" style="margin-top:16px;">
        <!-- saved reports will appear here -->
      </div>
    </section>

    <!-- INITIATE VIEW -->
    <section id="initView" class="screen" style="display:none;margin-top:16px;">
      <div class="card">
        <div class="init-top">
          <div>
            <h3 style="margin:0;">Ny rapport</h3>
            <small class="muted-note">Scan QR-koder og gem dem i rapporten</small>
          </div>
          <div>
            <button id="backToMain" class="ghost">Tilbage</button>
          </div>
        </div>

        <div class="items" id="itemsList">
          <div class="muted-note">Ingen poster endnu. Brug kameraet for at scanne QR-koder.</div>
        </div>

        <div class="toolbar">
          <button id="openScannerBtn" title="Scan QR" class="fab" aria-label="Åbn kamera">
            <!-- camera icon -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M3 7h3l2-3h6l2 3h3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
              <circle cx="12" cy="13" r="3.2" fill="white"/>
            </svg>
          </button>

          <button id="saveReportBtn" class="save-btn">Gem rapport</button>
        </div>

      </div>
    </section>

    <!-- Scanner modal -->
    <div id="scannerModal" class="modal" style="display:none;">
      <div class="scanner" role="dialog" aria-modal="true" aria-label="QR Scanner">
        <div class="topbar">
          <div style="font-weight:600">Scanner</div>
          <div>
            <button id="closeScanner" class="ghost">Luk</button>
          </div>
        </div>

        <div class="video-wrap">
          <video id="video" autoplay muted playsinline></video>
          <div class="scan-box">Hold QR i boksen</div>
        </div>

        <div id="foundArea" style="display:none;">
          <div class="found-popup">
            <div style="font-weight:700">Scannet data</div>
            <div id="foundText" style="word-break:break-word; margin-top:8px; color:var(--dark)"></div>
            <div style="margin-top:8px; display:flex; gap:8px; justify-content:flex-end;">
              <button id="declineBtn" class="ghost danger">Afvis</button>
              <button id="acceptBtn" class="primary">Accepter</button>
            </div>
          </div>
        </div>

        <div class="controls">
          <div id="scannerMsg" class="muted-note">Kamera klar...</div>
        </div>
      </div>
    </div>

    <!-- Hidden canvas for processing frames -->
    <canvas id="hiddenCanvas" style="display:none;"></canvas>
  </div>

  <!-- jsQR fallback library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <script>
    // App state and elements
    const mainScreen = document.getElementById('mainScreen');
    const initView = document.getElementById('initView');
    const newListBtn = document.getElementById('newListBtn');
    const backToMain = document.getElementById('backToMain');
    const openScannerBtn = document.getElementById('openScannerBtn');
    const saveReportBtn = document.getElementById('saveReportBtn');
    const itemsList = document.getElementById('itemsList');
    const reportsList = document.getElementById('reportsList');

    const scannerModal = document.getElementById('scannerModal');
    const video = document.getElementById('video');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const foundArea = document.getElementById('foundArea');
    const foundText = document.getElementById('foundText');
    const acceptBtn = document.getElementById('acceptBtn');
    const declineBtn = document.getElementById('declineBtn');
    const closeScanner = document.getElementById('closeScanner');
    const scannerMsg = document.getElementById('scannerMsg');

    let stream = null;
    let scanning = false;
    let lastFound = null;
    let items = []; // items in current report

    // storage keys
    const STORAGE_KEY = 'qr_reports_v1';
    const REPORT_WORK_KEY = 'qr_current_report_v1';

    // load saved reports to main screen
    function loadReports() {
      reportsList.innerHTML = '';
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (!saved.length) {
        const note = document.createElement('div');
        note.className = 'muted-note';
        note.textContent = 'Ingen gemte rapporter endnu.';
        reportsList.appendChild(note);
        return;
      }
      saved.reverse().forEach(rep => {
        const el = document.createElement('div');
        el.className = 'report-item';
        const left = document.createElement('div');
        left.innerHTML = `<div style="font-weight:600">${rep.title || 'Rapport'}</div><small>${new Date(rep.created).toLocaleString()}</small>`;
        const right = document.createElement('div');
        right.style.display = 'flex';
        right.style.gap = '8px';
        const viewBtn = document.createElement('button');
        viewBtn.className = 'ghost';
        viewBtn.textContent = 'Åbn';
        viewBtn.onclick = () => openReport(rep.id);
        const delBtn = document.createElement('button');
        delBtn.className = 'ghost';
        delBtn.textContent = 'Slet';
        delBtn.onclick = () => {
          if (confirm('Slet denne rapport?')) {
            deleteReport(rep.id);
          }
        };
        right.appendChild(viewBtn);
        right.appendChild(delBtn);
        el.appendChild(left);
        el.appendChild(right);
        reportsList.appendChild(el);
      });
    }

    function deleteReport(id) {
      let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      saved = saved.filter(r=>r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      loadReports();
    }

    function openReport(id) {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const rep = saved.find(r=>r.id===id);
      if (!rep) return alert('Kunne ikke finde rapport.');
      // show modal-like detail (quick)
      const content = rep.items.map((it, idx) => `${idx+1}. ${it}`).join('\\n\\n');
      alert(`Rapport: ${rep.title || 'Rapport'}\\nDato: ${new Date(rep.created).toLocaleString()}\\n\\n${content}`);
    }

    // navigation
    newListBtn.addEventListener('click', () => {
      // clear working items and show init view
      items = [];
      renderItems();
      mainScreen.style.display = 'none';
      initView.style.display = 'block';
      // store temp state (optional)
      localStorage.removeItem(REPORT_WORK_KEY);
    });
    backToMain.addEventListener('click', () => {
      initView.style.display = 'none';
      mainScreen.style.display = 'block';
    });

    // render items in initiate view
    function renderItems() {
      itemsList.innerHTML = '';
      if (!items.length) {
        const note = document.createElement('div');
        note.className = 'muted-note';
        note.textContent = 'Ingen poster endnu. Brug kameraet for at scanne QR-koder.';
        itemsList.appendChild(note);
        return;
      }
      items.forEach((it, idx) => {
        const el = document.createElement('div');
        el.className = 'item';
        const left = document.createElement('div');
        left.style.flex = '1';
        left.innerHTML = `<div class="txt">${escapeHtml(it)}</div><div class="meta">${new Date(it._when || Date.now()).toLocaleString ? new Date(it._when || Date.now()).toLocaleString() : ''}</div>`;
        const right = document.createElement('div');
        const rem = document.createElement('button');
        rem.className = 'ghost';
        rem.textContent = 'Fjern';
        rem.onclick = () => { items.splice(idx,1); renderItems(); };
        right.appendChild(rem);
        el.appendChild(left);
        el.appendChild(right);
        // store real data in dataset for display purposes
        itemsList.appendChild(el);
      });
    }

    // Escape HTML for safety in display
    function escapeHtml(text){
      if (typeof text !== 'string') text = String(text);
      return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Save report to storage
    saveReportBtn.addEventListener('click', () => {
      if (!items.length) {
        if (!confirm('Listen er tom. Vil du gemme en tom rapport?')) return;
      }
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const report = {
        id: 'r_' + Date.now(),
        title: 'Rapport ' + new Date().toLocaleString(),
        created: Date.now(),
        items: items.map(i => typeof i === 'string' ? i : (i.data || JSON.stringify(i)))
      };
      saved.push(report);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      alert('Rapport gemt.');
      // clear and return to main
      items = [];
      renderItems();
      initView.style.display = 'none';
      mainScreen.style.display = 'block';
      loadReports();
    });

    // Scanner logic: try BarcodeDetector first
    let barcodeDetector = null;
    if ('BarcodeDetector' in window) {
      try {
        barcodeDetector = new BarcodeDetector({formats: ['qr_code']});
      } catch(e) {
        barcodeDetector = null;
      }
    }

    // open scanner modal
    openScannerBtn.addEventListener('click', async () => {
      // open modal and camera
      scannerModal.style.display = 'flex';
      foundArea.style.display = 'none';
      foundText.textContent = '';
      await startCameraAndScan();
    });

    closeScanner.addEventListener('click', () => {
      stopCamera();
      scannerModal.style.display = 'none';
    });

    // Accept and Decline behavior
    acceptBtn.addEventListener('click', () => {
      if (!lastFound) return;
      // save to items but keep camera open for more
      items.push({data: lastFound, _when: Date.now()});
      renderItems();
      foundArea.style.display = 'none';
      lastFound = null;
      // continue scanning automatically
      scannerMsg.textContent = 'Gemte. Fortsæt scanning...';
      setTimeout(()=>scannerMsg.textContent = 'Kamera klar...', 900);
    });

    declineBtn.addEventListener('click', () => {
      // close popup and continue scanning (re-scan)
      foundArea.style.display = 'none';
      lastFound = null;
      scannerMsg.textContent = 'Forsøg at scanne igen...';
    });

    // camera start/stop
    async function startCameraAndScan() {
      try {
        scannerMsg.textContent = 'Starter kamera...';
        stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'} , audio:false});
        video.srcObject = stream;
        await video.play();
        scanning = true;
        scannerMsg.textContent = 'Søger efter QR...';
        // prefer BarcodeDetector if available
        if (barcodeDetector) {
          runBarcodeDetector();
        } else {
          runJsQr();
        }
      } catch (err) {
        console.error('Camera error', err);
        scannerMsg.textContent = 'Kunne ikke få adgang til kamera. Tillad kameraadgang eller brug en kompatibel enhed.';
        alert('Kan ikke åbne kameraet: ' + (err && err.message ? err.message : err));
        scannerModal.style.display = 'none';
      }
    }

    function stopCamera() {
      scanning = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.pause();
      video.srcObject = null;
      foundArea.style.display = 'none';
      lastFound = null;
    }

    // BarcodeDetector loop
    async function runBarcodeDetector(){
      try {
        while (scanning) {
          try {
            const barcodes = await barcodeDetector.detect(video);
            if (barcodes && barcodes.length) {
              const b = barcodes[0];
              if (b && b.rawValue) {
                handleFound(b.rawValue);
                // pause a bit to avoid duplicate hits
                await new Promise(r => setTimeout(r, 800));
              }
            }
          } catch (e) {
            console.warn('Barcode detection error', e);
            // fallback to jsQR if error
            runJsQr();
            return;
          }
          await new Promise(r => setTimeout(r, 200));
        }
      } catch (err) {
        console.error(err);
      }
    }

    // jsQR fallback implementation (canvas)
    function runJsQr(){
      const ctx = hiddenCanvas.getContext('2d');
      // ideal canvas size: match video
      function frameLoop() {
        if (!scanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          if (vw && vh) {
            hiddenCanvas.width = vw;
            hiddenCanvas.height = vh;
            ctx.drawImage(video, 0, 0, vw, vh);
            const imgd = ctx.getImageData(0,0,vw,vh);
            const code = jsQR(imgd.data, vw, vh, {inversionAttempts:'attemptBoth'});
            if (code && code.data) {
              handleFound(code.data);
            }
          }
        }
        requestAnimationFrame(frameLoop);
      }
      requestAnimationFrame(frameLoop);
    }

    // Called when QR data found
    function handleFound(data) {
      // if same as last found, ignore to avoid duplicates
      if (lastFound === data) return;
      lastFound = data;
      foundText.textContent = data;
      foundArea.style.display = 'block';
      scannerMsg.textContent = 'QR fundet - godkend eller afvis';
      // show accept/decline; if user declines, scanning continues
      // if user accepts, we add to items and continue scanning (as implemented)
    }

    // On page load, show saved reports
    loadReports();

    // stop camera when leaving page or hidden
    window.addEventListener('pagehide', () => stopCamera());
    window.addEventListener('beforeunload', () => stopCamera());

    // small helper to persist in-progress report if desired (not required)
    // optional: you could save items to session/local storage periodically
  </script>
</body>
</html>
